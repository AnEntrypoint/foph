- id: debug-webjsx-mount
  subject: Debug webjsx mount rendering failure on live GitHub Pages
  status: pending
  description: >-
    Prior session: home page loads HTTP 200 but page.evaluate shows AppShell/Topbar/Section not rendering to DOM. Mount code embedded in HTML is syntactically correct. Debug: (1) exec:browser with page.evaluate checking window.console for errors post-load, (2) verify unpkg CDN 247420.js fetch success via Network inspection, (3) check window.__debug for render state, (4) inspect actual #app DOM to see if mount() produced elements. Hypothesis: mount() executed but produced no DOM or threw unhandled error.
  effort: medium
  category: bug
  route_family: execution
  load: 0.9
  failure_modes:
    - mount() throws unhandled error silently
    - CDN 247420.js fails to parse or load
    - page data shape doesn't match component expectations
    - webjsx components not found in window namespace
  route_fit: examined
  authorization: witnessed
  blocking:
    - integrate-design-system
  blockedBy: []
  acceptance:
    - root cause identified via browser console.error or page.evaluate checks
    - mount() call verified executing in page context
    - #app DOM inspected post-mount (empty vs populated)
    - unpkg CDN fetch confirmed successful via Network tab
    - next step clear (fix root cause or modify page data)
  edge_cases:
    - mount() runs but components are undefined — check importmap syntax
    - page data passed as invalid JSON — inspect window.pageBody in console
    - CDN script load race condition — add defer or explicit Promise.all on import

