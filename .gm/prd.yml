- id: integrate-design-system
  subject: Integrate anentrypoint-design into flatspace theme
  status: pending
  description: >-
    Rewrite website/theme.mjs to import anentrypoint-design v0.0.29 from unpkg
    CDN, replace hardcoded HTML/CSS with webjsx-based AppShell + Topbar + main
    content via page data. Pro-rata: use Section, Panel, Row, Rail, Dot
    components per design paradigm (tonal surfaces over borders, indicator
    rails, generous spacing, typography hierarchy). No custom CSS overrides.
  effort: medium
  category: feature
  route_family: execution
  load: 0.85
  failure_modes:
    - webjsx render fails on unpkg CDN
    - page data shape mismatches component expectations
    - CSS scoping .ds-247420 conflicts with existing styles
  route_fit: examined
  authorization: witnessed
  blocking:
    - rebuild-pages
  blockedBy: []
  acceptance:
    - >-
      theme.mjs imports anentrypoint-design from unpkg, mounts AppShell with
      Topbar + main Section
    - all 7 pages render without JS errors in live browser
    - >-
      visual layout respects pro-rata: tonal backgrounds, rails on list items,
      4px spacing grid, Nunito/Archivo/Mono type hierarchy
    - exec:browser witness on each page validates DOM structure and CSS classes
  edge_cases:
    - CDN unavailable — fallback to local dist rebuild
    - webjsx mount fails — check page data shape vs component schema
- id: rebuild-pages
