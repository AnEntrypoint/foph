- id: fix-npm-dependency-spec
  subject: Fix anentrypoint-design dependency oscillation
  status: pending
  description: 'package.json oscillates between file:../anentrypoint-design (local) and ^0.0.29 (npm). CI uses npm ci which requires lockfile consistency. Root cause: auto-release script (likely in release tooling) reverts manual npm version fixes. Solution: Use unpkg CDN exclusively for theme.mjs runtime (already done) and remove file:// local dependency entirely. Verify no other code imports the local design repo.'
  effort: medium
  category: infra
  route_family: boundary
  load: 0.9
  failure_modes:
    - Pages deployment continues to fail on npm ci
    - manual npm version pins get reverted by CI
    - lockfile/package.json mismatch triggers CI failures
  route_fit: examined
  authorization: witnessed
  blocking:
    - validate-pages-deployment
  blockedBy:
    - revert-pages-workflow
  acceptance:
    - package.json has no file:// dependency on anentrypoint-design
    - package.json specifies npm version from unpkg (^0.0.29 or newer)
    - lockfile regenerated and consistent
    - verify no imports of ../anentrypoint-design in src/
    - npm ci succeeds locally
  edge_cases:
    - auto-release tooling must not revert the fix
- id: validate-pages-deployment
  subject: Validate GitHub Pages deployment and live browser rendering
  status: pending
  description: 'Once npm/CI pipeline is fixed, verify Pages builds successfully and deploys. Validate live rendering on GH Pages domain with exec:browser: check HTTP 200, DOM structure, pro-rata CSS styling, and typography. Fix any rendering issues.'
  effort: medium
  category: feature
  route_family: execution
  load: 0.95
  failure_modes:
    - Pages still return 404 or error page
    - CSS does not load from unpkg CDN
    - webjsx components fail to mount
    - AppShell/Topbar/Section not rendered
  route_fit: examined
  authorization: weak_prior
  blocking: []
  blockedBy:
    - fix-npm-dependency-spec
  acceptance:
    - GitHub Pages URL returns HTTP 200
    - 'exec:browser witness: page.goto(pages_url) succeeds'
    - 'page.evaluate confirms DOM has #app root with AppShell children'
    - pro-rata CSS classes applied (e.g., tonal-surface, indicator-rail)
    - typography stack correct (Archivo, Nunito, JetBrains Mono)
    - all page sections render without JS errors
  edge_cases:
    - unpkg CDN latency or transient failures
