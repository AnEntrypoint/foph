- id: browser-validate-pages
  subject: Live browser validation of all 7 pages on GitHub Pages
  status: pending
  description: >-
    For each page (home, architecture, cli, tools, platforms, skills,
    development): (1) boot exec:browser, (2) navigate to
    https://anentrypoint.github.io/foph/<slug>/, (3) exec:browser page.evaluate
    to assert DOM structure (AppShell present, nav rendered, main Section with
    panels/rows), (4) validate pro-rata CSS: tonal backgrounds, no borders,
    rails present on categorized items, spacing/type hierarchy per SKILL.md.
    Capture witness of layout, colors, spacing.
  effort: large
  category: feature
  route_family: execution
  load: 0.9
  failure_modes:
    - page 404 (not deployed yet)
    - webjsx render errors (console.error)
    - CSS scoping broken (.ds-247420 not applied)
    - layout regression from old theme
  route_fit: examined
  authorization: witnessed
  blocking: []
  blockedBy:
    - flatspace-build-test
  acceptance:
    - all 7 pages HTTP 200, no console errors
    - 'DOM: AppShell > Topbar (with brand + nav) > Crumb + main Section'
    - >-
      CSS: .ds-247420 scope applied, panels use --panel-1/2/3 tonal backgrounds,
      no <border> elements
    - >-
      Rails: categorized items (tools, platforms, skills) display rail-colored
      left stripes
    - >-
      Type: h1/h2 use --ff-display (Archivo Black), body uses --ff-ui (Nunito),
      code blocks use --ff-mono (JetBrains)
    - >-
      Spacing: sections separated by 32px gap, row padding 6–10px, list row
      height 36–44px, no margins breaking the 4px grid
    - screenshot + page.evaluate output captured per page
  edge_cases:
    - page not yet deployed to GitHub Pages — git push required first
    - live site still showing old theme — hard-refresh browser cache
