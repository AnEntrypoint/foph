- id: fix-npm-dependency-spec
  subject: Remove file:// anentrypoint-design dependency from package.json
  status: completed
  description: 'package.json line 19 specifies "anentrypoint-design": "file:../anentrypoint-design", causing npm ci to force local resolution. theme.mjs uses only unpkg CDN (lines 56, 58). Remove this dependency entirely, verify no other src/ files import ../anentrypoint-design, regenerate lockfile via npm ci.'
  effort: small
  category: infra
  route_family: boundary
  load: 0.95
  failure_modes:
    - lockfile remains oscillated
    - npm ci fails in CI
    - undetected remaining import of ../anentrypoint-design
  route_fit: dominant
  authorization: witnessed
  blocking:
    - validate-pages-deployment
  blockedBy: []
  acceptance:
    - package.json has no "anentrypoint-design" key in dependencies
    - codesearch confirms zero imports of ../anentrypoint-design in src/
    - npm ci completes successfully
    - package-lock.json does not contain file:../ entries
  edge_cases:
    - Hidden import of anentrypoint-design from node_modules by transitive dep
