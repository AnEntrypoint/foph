- id: db-abstraction-layer
  subject: Create database abstraction layer for sql.js polymorphism
  status: pending
  description: Design and implement a minimal DB abstraction (adapter pattern) that wraps sql.js, allowing single codebase to run in CLI (Node.js) and browser (wasm). Must support prepare(), exec(), transaction(), and FTS5 queries. Handle initialization, WAL pragma, table creation.
  effort: medium
  category: infra
  route_family: execution
  load: 0.8
  failure_modes: ['API mismatch: sql.js prepare() returns different interface than better-sqlite3', 'FTS5 unavailable in sql.js (no extension support); must fallback to LIKE queries', 'In-browser persistence: sql.js is in-memory by default; need IndexedDB adapter or client-side export', 'Performance: sql.js is slower than native bindings; may need indexed access optimization']
  route_fit: examined
  authorization: witnessed
  blocking: ['migrate-sessions-store', 'migrate-memory-tool', 'migrate-cron-jobs', 'migrate-account-usage', 'migrate-todos-file-state', 'migrate-skill-usage']
  blockedBy: []
  acceptance:
    - Single DB module exports: db(), prepare(), exec(), transaction(), fts5Ready property
    - Works in Node.js via sql.js npm package (in-memory or IndexedDB if provided)
    - Works in browser via sql.js wasm, persists via IndexedDB adapter
    - All existing prepare/exec calls work unmodified
    - FTS5 gracefully unavailable with fallback to LIKE queries
  edge_cases: ['In-memory DB for tests must reset cleanly', 'Concurrent writes in Node.js (sql.js is JS, not atomic)', 'Browser storage quotas']

