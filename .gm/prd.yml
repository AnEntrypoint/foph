- id: validate-pages-deployment
  subject: Boot GitHub Pages, witness DOM/CSS/typography via browser
  status: pending
  description: "After fix-npm-dependency-spec resolves lockfile, trigger Pages build. Boot deployed page (https://anentrypoint.github.io/foph or equivalent), exec:browser to navigate, page.evaluate asserting (1) page loads HTTP 200, (2) DOM has .ds-247420 scope, (3) Nunito/Archivo Black/JetBrains Mono fonts loaded, (4) panel tonal colors render (--panel-0 through --panel-3), (5) navbar, breadcrumb, section, panel layout present, (6) text renders at 14-15px body size."
  effort: medium
  category: infra
  route_family: execution
  load: 0.95
  failure_modes: ["Page returns 404","CSS fails to load from unpkg","DOM structure broken","font rendering fails","layout collapses"]
  route_fit: dominant
  authorization: witnessed
  blocking: []
  blockedBy: ["fix-npm-dependency-spec"]
  acceptance:
    - Browser navigates to deployed Pages URL and receives HTTP 200
    - page.evaluate confirms window.innerWidth exists and page has html.ds-247420
    - Topbar, Breadcrumb, Section, Panel components render in DOM
    - CSS font-family applied: body is Nunito, h1 is Archivo Black, code is JetBrains Mono
    - Color tokens resolved: getComputedStyle(panel) contains panel-1 tonal background
    - Text baseline size confirmed: 14-15px body
  edge_cases:
