- id: fix-pages-action-version
  subject: Update GitHub Pages action to v5 (potential API bug workaround)
  status: pending
  description: Pages.yml uses actions/deploy-pages@v2. Runs 10-14 fail with GitHub API 404 'Cannot find any run with github.run_id <ID>' at artifact metadata lookup. Artifact uploads succeed; failure is GitHub's internal API inconsistency. Update deploy-pages action to latest version (v5+) to bypass potential v2 bug. Trigger workflow after update.
  effort: small
  category: infra
  route_family: boundary
  load: 0.6
  failure_modes:
    - workflow syntax error after action version bump
    - deployment still fails with same API error
  route_fit: examined
  authorization: witnessed
  blocking:
    - validate-pages-deployment
  blockedBy: []
  acceptance:
    - actions/deploy-pages updated to v5 or later in pages.yml
    - workflow syntax validates
    - Pages workflow triggered and runs to completion
  edge_cases:
    - v5 action breaking changes
    - API error persists (indicates external GitHub infrastructure issue)
- id: validate-pages-deployment
  subject: Boot GitHub Pages, witness DOM/CSS/typography via browser
  status: pending
  description: After fix-pages-action-version resolves deployment. Boot deployed page (https://anentrypoint.github.io/foph or equivalent), exec:browser to navigate, page.evaluate asserting (1) page loads HTTP 200, (2) DOM has .ds-247420 scope, (3) Nunito/Archivo Black/JetBrains Mono fonts loaded, (4) panel tonal colors render (--panel-0 through --panel-3), (5) navbar, breadcrumb, section, panel layout present, (6) text renders at 14-15px body size.
  effort: medium
  category: infra
  route_family: execution
  load: 0.95
  failure_modes:
    - Page returns 404
    - CSS fails to load from unpkg
    - DOM structure broken
    - font rendering fails
    - layout collapses
  route_fit: dominant
  authorization: witnessed
  blocking: []
  blockedBy:
    - fix-pages-action-version
  acceptance:
    - Browser navigates to deployed Pages URL and receives HTTP 200
    - page.evaluate confirms window.innerWidth exists and page has html.ds-247420
    - Topbar, Breadcrumb, Section, Panel components render in DOM
    - CSS font-family applied: body is Nunito, h1 is Archivo Black, code is JetBrains Mono
    - Color tokens resolved: getComputedStyle(panel) contains panel-1 tonal background
    - Text baseline size confirmed: 14-15px body
  edge_cases:
    - CDN unpkg momentarily down
    - GitHub Pages deployment delay (wait up to 2min)
    - Browser cache stale (clear before witness)
    - If v5 upgrade does not resolve API error, this item remains blockedBy external GitHub infrastructure failure
