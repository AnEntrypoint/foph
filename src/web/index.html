<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foph Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<script type="importmap">
{ "imports": { "anentrypoint-design": "/vendor/anentrypoint-design/247420.js" } }
</script>
<style>
/* Clean skin — adapted from c:/dev/hermes-theme onto 247420 panel tokens */
html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: "Google Sans", "Roboto", system-ui, -apple-system, sans-serif;
}
html[data-theme="light"] body { background: #f6f8fc; color: #202124; }
html[data-theme="dark"]  body { background: #1f1f1f; color: #e8eaed; }

html[data-theme="light"] .ds-247420 {
    --panel-0: #f6f8fc;
    --panel-1: #ffffff;
    --panel-2: #f1f3f4;
    --panel-3: #e8eaed;
    --panel-hover: #f1f3f4;
    --panel-select: #fce8e6;
    --panel-text:   #202124;
    --panel-text-2: #5f6368;
    --panel-text-3: #80868b;
    --panel-accent:    #d93025;
    --panel-accent-2:  #1a73e8;
    --panel-accent-fg: #ffffff;
    --panel-shadow: none;
    --panel-shadow-top: none;
    --paper: #ffffff;
    --ink:   #202124;
    --green: #137333;
}
html[data-theme="dark"] .ds-247420 {
    --panel-0: #1f1f1f;
    --panel-1: #2d2e30;
    --panel-2: #3c4043;
    --panel-3: #5f6368;
    --panel-hover: #35363a;
    --panel-select: #3c2123;
    --panel-text:   #e8eaed;
    --panel-text-2: #9aa0a6;
    --panel-text-3: #80868b;
    --panel-accent:    #f28b82;
    --panel-accent-2:  #8ab4f8;
    --panel-accent-fg: #1f1f1f;
    --panel-shadow: none;
    --panel-shadow-top: none;
    --paper: #2d2e30;
    --ink:   #e8eaed;
    --green: #81c995;
}

/* Force Google Sans/Roboto across the design system without fighting it */
.ds-247420, .ds-247420 * {
    font-family: "Google Sans", "Roboto", system-ui, -apple-system, sans-serif;
    letter-spacing: 0;
}
.ds-247420 code, .ds-247420 pre, .ds-247420 .code, .ds-247420 .meta,
.ds-247420 [class*="mono"], .ds-247420 .cli {
    font-family: "Roboto Mono", ui-monospace, monospace;
}

/* Panel rounding — flat inbox aesthetic */
.ds-247420 .panel { border-radius: 8px; }

/* Active nav row uses red-tint per clean theme */
.ds-247420 .app-side a.active {
    background: var(--panel-select);
    color: var(--panel-accent);
    font-weight: 500;
}

/* Status bar reads better as a thin divider, not a colored ribbon */
.ds-247420 .app-status {
    background: var(--panel-1);
    color: var(--panel-text-2);
    border-top: 1px solid var(--panel-3);
    height: 28px;
}

/* Inputs/buttons baseline */
.ds-247420 input, .ds-247420 textarea, .ds-247420 select {
    background: var(--panel-2);
    color: var(--panel-text);
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
}
.ds-247420 input:focus, .ds-247420 textarea:focus {
    background: var(--panel-1);
    border-color: var(--panel-accent-2);
}
.ds-247420 button {
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
    font-weight: 500;
    border: none;
    padding: 8px 16px;
}
.ds-247420 button.primary { background: var(--panel-accent-2); color: #fff; }
.ds-247420 button.danger  { background: var(--panel-accent);   color: #fff; }
.ds-247420 button.ghost   { background: transparent; color: var(--panel-text); border: 1px solid var(--panel-3); }
.ds-247420 button:hover   { filter: brightness(1.08); }

.ds-247420 table { width: 100%; border-collapse: collapse; }
.ds-247420 th, .ds-247420 td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--panel-3); font-size: 13px; }
.ds-247420 th { color: var(--panel-text-2); font-weight: 500; background: var(--panel-2); }
.ds-247420 tr.clickable { cursor: pointer; }
.ds-247420 tr.clickable:hover td { background: var(--panel-hover); }

.ds-247420 .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--panel-3); padding: 1px; border-radius: 8px; overflow: hidden; }
.ds-247420 .kpi-card { background: var(--panel-1); padding: 14px 18px; }
.ds-247420 .kpi-card .num { font-size: 1.75rem; color: var(--panel-text); font-weight: 400; }
.ds-247420 .kpi-card .lbl { font-size: 0.7rem; color: var(--panel-text-2); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

.ds-247420 .row-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; margin-bottom: 12px; }
.ds-247420 .row-form input { flex: 1; min-width: 140px; }

/* chat: SDK provides .chat / .chat-thread / .chat-msg / .chat-bubble. */
/* Cap chat thread height in dashboard so composer stays visible. */
.ds-247420 .chat .chat-thread { max-height: calc(100vh - 320px); overflow-y: auto; }

/* Chip tones for env keys page. */
.ds-247420 .chip.ok   { background: rgba(26,115,232,0.15); color: var(--panel-accent-2); }
.ds-247420 .chip.miss { background: rgba(217,48,37,0.15);  color: var(--panel-accent); }

.ds-247420 .empty { color: var(--panel-text-3); padding: 12px 0; }
.ds-247420 a { color: var(--panel-accent-2); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
